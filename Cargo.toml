[package]
name = "rmlib"
version = "0.10.0"
edition = "2024"
authors = ["Mus <cuteemus@gmail.com>"]
description = "Rust Minecraft Launcher library"
license = "LGPL-3.0-only"
repository = "https://github.com/musdev13/rmlib"
keywords = ["minecraft", "launcher", "game"]
categories = ["game-engines"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0", features = ["derive"] }
musutils = { path = "../musutils", features = ["fs-v2", "http-v2", "os-v2", "types-v2", "color-v2"] }
clap = { version = "4.6", features = ["derive"] }
zip = "9.1"
sha1 = "0.11.0"
reqwest = { version = "0.13.5", features = ["blocking","json"] }
roxmltree = "=0.18.1"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1.0.154"
zip = "9.1"
musutils = { path = "../musutils", features = ["fs-v2", "http-v2", "os-v2", "types-v2", "color-v2"] }

[features]
default = ["core", "ely", "fabric", "neoforge"]
core = []
ely = ["core"]
fabric = ["core"]
neoforge = ["core"]
ffi = ["dep:tokio"]
